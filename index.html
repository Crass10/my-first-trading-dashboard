<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Source Trading Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library Open Source: TradingView Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1f2937; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">
  
  <!-- Header Minimalista -->
  <header class="p-3 bg-gray-800 border-b border-gray-700 flex justify-between items-center flex-wrap gap-2">
    <div class="flex items-center gap-3">
      <h1 class="text-lg font-bold text-yellow-400 flex items-center gap-2">
        <span>⚡ Open Source Multi-Asset Dashboard</span>
      </h1>
      <span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded border border-gray-600">
        Standalone Engine (Canvas Rendered)
      </span>
    </div>
    
    <div class="flex items-center gap-2 text-xs">
      <button onclick="changeAsset('XAUUSD')" id="btn-XAUUSD" class="px-3 py-1 bg-yellow-600 font-bold text-black rounded transition">XAUUSD</button>
      <button onclick="changeAsset('EURUSD')" id="btn-EURUSD" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 text-white rounded transition">EURUSD</button>
      <button onclick="changeAsset('NASDAQ')" id="btn-NASDAQ" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 text-white rounded transition">NQ / QQQ</button>
    </div>
  </header>

  <!-- Main Layout Grid -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-4 p-4">
    
    <!-- Columna Principal: Gráfico Open Source (2 columnas) -->
    <section class="lg:col-span-2 flex flex-col gap-4">
      
      <!-- Contenedor del Gráfico Canvas -->
      <div class="bg-gray-800 rounded-lg p-3 h-[500px] border border-gray-700 flex flex-col relative">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-700 text-xs">
          <span id="chart-title" class="font-bold text-yellow-400">XAUUSD - Live Open Source Canvas Chart</span>
          <div class="flex gap-2">
            <span class="text-gray-400">Timeframe: <strong class="text-white">1H</strong></span>
          </div>
        </div>
        
        <!-- Render del Canvas con Lightweight Charts -->
        <div id="open-source-chart" class="flex-1 w-full h-full rounded"></div>
      </div>

    </section>

    <!-- Columna Derecha: Forex Factory Calendar (1 columna) -->
    <section class="flex flex-col gap-4">
      
      <!-- Módulo Economic Calendar -->
      <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 h-[500px] flex flex-col">
        
        <div class="flex flex-wrap justify-between items-center gap-2 mb-3 pb-2 border-b border-gray-700">
          <div class="flex items-center gap-2">
            <span class="text-base">📅</span>
            <h2 class="text-xs font-bold text-yellow-400">Economic Feed</h2>
          </div>
          
          <select id="currency-filter" onchange="applyFilters()" class="bg-gray-900 text-gray-200 text-xs px-2 py-1 rounded border border-gray-600 focus:outline-none">
            <option value="ALL">Todas las Monedas</option>
            <option value="USD_EUR" selected>USD / EUR</option>
            <option value="USD">Solo USD</option>
            <option value="EUR">Solo EUR</option>
          </select>
        </div>

        <div class="flex gap-1 mb-3 text-[11px]">
          <button onclick="filterByPreset('today')" class="flex-1 py-1 bg-gray-700 hover:bg-yellow-600 rounded transition text-center font-medium">Hoy</button>
          <button onclick="filterByPreset('week')" class="flex-1 py-1 bg-gray-700 hover:bg-yellow-600 rounded transition text-center font-medium">Semana</button>
          <button onclick="filterByPreset('month')" class="flex-1 py-1 bg-gray-700 hover:bg-yellow-600 rounded transition text-center font-medium">Mes</button>
        </div>

        <!-- Tabla de Eventos Económicos -->
        <div class="overflow-y-auto flex-1 border border-gray-700 rounded bg-gray-900/50">
          <table class="w-full text-left text-xs text-gray-300">
            <thead class="bg-gray-800 text-gray-400 uppercase text-[9px] sticky top-0 border-b border-gray-700">
              <tr>
                <th class="p-2">Fecha/Hora</th>
                <th class="p-2">Divisa</th>
                <th class="p-2">Evento</th>
                <th class="p-2 text-right">Act/Prev</th>
              </tr>
            </thead>
            <tbody id="ff-calendar-tbody" class="divide-y divide-gray-800">
              <tr>
                <td colspan="4" class="p-4 text-center text-gray-400">Cargando eventos...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

    </section>
  </main>

  <script>
    let chart, candleSeries, volumeSeries;
    let currentAsset = 'XAUUSD';
    let allEvents = [];
    let currentFilterMode = 'month';

    // Inicializar Gráfico Lightweight Open Source
    function initChart() {
      const container = document.getElementById('open-source-chart');
      
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          backgroundColor: '#111827',
          textColor: '#D1D5DB',
        },
        grid: {
          vertLines: { color: '#1F2937' },
          horzLines: { color: '#1F2937' },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
        },
        priceScale: {
          borderColor: '#374151',
        },
        timeScale: {
          borderColor: '#374151',
          timeVisible: true,
        },
      });

      candleSeries = chart.addCandlestickSeries({
        upColor: '#10B981',
        downColor: '#EF4444',
        borderDownColor: '#EF4444',
        borderUpColor: '#10B981',
        wickDownColor: '#EF4444',
        wickUpColor: '#10B981',
      });

      volumeSeries = chart.addHistogramSeries({
        color: '#26a69a',
        priceFormat: { type: 'volume' },
        priceScaleId: '',
        scaleMargins: { top: 0.8, bottom: 0 },
      });

      loadSampleData(currentAsset);

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
    }

    // Generar o Cargar Datos Simulados para el Gráfico
    function loadSampleData(asset) {
      document.getElementById('chart-title').innerText = `${asset} - Live Open Source Canvas Chart`;

      let basePrice = asset === 'XAUUSD' ? 2400 : (asset === 'EURUSD' ? 1.0850 : 19500);
      let data = [];
      let volumeData = [];
      let now = new Date();
      now.setDate(now.getDate() - 30);

      for (let i = 0; i < 100; i++) {
        let open = basePrice + (Math.random() - 0.48) * (basePrice * 0.005);
        let high = open + Math.random() * (basePrice * 0.003);
        let low = open - Math.random() * (basePrice * 0.003);
        let close = (high + low) / 2;
        let time = Math.floor(now.getTime() / 1000) + (i * 86400);

        data.push({ time, open, high, low, close });
        volumeData.push({
          time,
          value: Math.floor(Math.random() * 1000) + 100,
          color: close >= open ? 'rgba(16, 185, 129, 0.4)' : 'rgba(239, 68, 68, 0.4)'
        });

        basePrice = close;
      }

      candleSeries.setData(data);
      volumeSeries.setData(volumeData);
    }

    function changeAsset(asset) {
      currentAsset = asset;
      ['XAUUSD', 'EURUSD', 'NASDAQ'].forEach(a => {
        const btn = document.getElementById(`btn-${a}`);
        if (a === asset) {
          btn.className = 'px-3 py-1 bg-yellow-600 font-bold text-black rounded transition';
        } else {
          btn.className = 'px-3 py-1 bg-gray-700 hover:bg-gray-600 text-white rounded transition';
        }
      });
      loadSampleData(asset);
    }

    // Lógica Calendario
    async function loadCalendarData() {
      const tbody = document.getElementById('ff-calendar-tbody');
      try {
        let response = await fetch('https://raw.githubusercontent.com/rrebase/economic-calendar/data/data.json');
        allEvents = await response.json();
        applyFilters();
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-2 text-center text-red-400">Error al cargar el feed.</td></tr>';
      }
    }

    function applyFilters() {
      if (!allEvents || allEvents.length === 0) return;

      const currencyFilter = document.getElementById('currency-filter').value;
      const today = new Date();

      let filtered = allEvents.filter(event => {
        const eventDate = new Date(event.date);

        if (currencyFilter === 'USD_EUR' && !(event.country === 'USD' || event.country === 'EUR')) return false;
        if (currencyFilter === 'USD' && event.country !== 'USD') return false;
        if (currencyFilter === 'EUR' && event.country !== 'EUR') return false;

        if (currentFilterMode === 'today') {
          return eventDate.toDateString() === today.toDateString();
        } else if (currentFilterMode === 'week') {
          const first = new Date(today.setDate(today.getDate() - today.getDay()));
          const last = new Date(today.setDate(today.getDate() - today.getDay() + 6));
          return eventDate >= first && eventDate <= last;
        } else if (currentFilterMode === 'month') {
          return eventDate.getMonth() === new Date().getMonth() && eventDate.getFullYear() === new Date().getFullYear();
        }

        return true;
      });

      renderCalendarTable(filtered);
    }

    function renderCalendarTable(events) {
      const tbody = document.getElementById('ff-calendar-tbody');
      tbody.innerHTML = '';

      if (events.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-2 text-center text-gray-400">Sin eventos.</td></tr>';
        return;
      }

      events.forEach(event => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-800 transition';

        let impactIcon = '⚪';
        if (event.impact === 'High' || event.impact === 'Red') impactIcon = '🔴';
        else if (event.impact === 'Medium' || event.impact === 'Orange') impactIcon = '🟠';

        const dateFormatted = new Date(event.date).toLocaleDateString([], {month: 'numeric', day: 'numeric'});

        tr.innerHTML = `
          <td class="p-1.5 text-[10px] text-gray-400">${dateFormatted}</td>
          <td class="p-1.5 font-bold text-gray-200">${event.country || 'USD'} ${impactIcon}</td>
          <td class="p-1.5 font-medium text-gray-300 truncate max-w-[100px]">${event.title}</td>
          <td class="p-1.5 text-right font-mono text-[10px]">
            <span class="text-green-400">${event.actual || '-'}</span>/<span class="text-yellow-300">${event.forecast || '-'}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterByPreset(preset) {
      currentFilterMode = preset;
      applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initChart();
      loadCalendarData();
    });
  </script>
</body>
</html>
